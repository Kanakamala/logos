<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const shortCode = urlParams.get('p');
            const baseScriptUrl = "https://script.google.com/macros/s/AKfycbwHoX7JTr5g9EWmh-FIN4d47Fiqzn2uuloK5AOICIuOL2y_Q9TfAInNaPNpELLKJ93-/exec";

            if (shortCode) {
                const targetUrl = baseScriptUrl + "/" + encodeURIComponent(shortCode);
                
                // Primary redirect method
                window.location.replace(targetUrl);
                
                // Fallback redirect method if the window location gets hung up
                setTimeout(function() {
                    window.location.href = targetUrl;
                }, 500);
            } else {
                document.body.innerHTML = "<h3>⚠️ Error: No short code specified.</h3>";
            }
        })();
    </script>
</head>
<body>
    <p>Loading destination... If you are not redirected in a few seconds, please wait.</p>
</body>
</html>
